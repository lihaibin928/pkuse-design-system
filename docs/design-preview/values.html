<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>价值观 · Pkuse Design 设计规范</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body data-page="values">
  <div class="shell">
    <nav id="site-nav"></nav>
    <main>
<h2 id="values">价值观</h2>
      <p class="lead">四个价值观指导系统中的每一个决策。</p>
      <div class="values">
        <div class="value-card"><strong>自然</strong><p>界面遵循既有惯例，不让回头用户感到意外。优先采用操作系统和前代企业软件中已存在的模式，而不是发明新交互。</p></div>
        <div class="value-card"><strong>确定性</strong><p>用户始终知道自己处于什么状态、输入产生了什么结果、下一步是什么。悬停、焦点、加载和错误状态明确且一致。</p></div>
        <div class="value-card"><strong>意义感</strong><p>视觉强调只留给行动。不传达信息的装饰一律去掉。</p></div>
        <div class="value-card"><strong>生长性</strong><p>系统可以从小表单扩到密表格、再扩到多租户管理控制台，而不失去一致性。</p></div>
      </div>
    </main>
  </div>
  <script src="assets/layout.js"></script>
</body>
</html>
