<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按钮 · Pkuse Design 设计规范</title>
  <link rel="stylesheet" href="assets/theme.css?v=2" />
</head>
<body data-page="button">
  <div class="shell">
    <nav id="site-nav"></nav>
    <main>
<h2 id="button">按钮</h2>
      <div class="card">
        <h3>Button · primary</h3>
        <p class="note">每个屏幕唯一的主导操作。实心主色、白字、32px 高、6px 圆角。悬停变 <code>#4096FF</code>，按下变 <code>#0958D9</code>。同一决策面不要叠两个主按钮。</p>
        <div class="btn-row">
          <button class="btn-primary" type="button">查询</button>
          <button class="btn-default" type="button">重置</button>
          <button class="btn-disabled" type="button" disabled>无权限</button>
        </div>

        <h3>Button · default</h3>
        <p class="note">次要操作。白底透明填充、深色文字、1px 描边。悬停文字与边框变为 <code>#4096FF</code>。</p>
      </div>

    </main>
  </div>
  <script src="assets/layout.js?v=2"></script>
</body>
</html>
