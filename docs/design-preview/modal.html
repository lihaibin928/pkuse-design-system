<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>对话框 · Pkuse Design 设计规范</title>
  <link rel="stylesheet" href="assets/theme.css?v=2" />
</head>
<body data-page="modal">
  <div class="shell">
    <nav id="site-nav"></nav>
    <main>
<h2 id="modal">对话框</h2>
      <div class="card">
        <h3>Modal</h3>
        <p class="note">与 Card 同表面和圆角，但用次级阴影，居中叠在 <code>rgba(0,0,0,0.45)</code> 遮罩上。主体 padding 上下 20px、左右 24px。</p>
        <div class="modal-stage">
          <div class="modal-mask"></div>
          <div class="modal-panel">
            <span class="modal-close">×</span>
            <h4 style="margin-top:0;font-size:16px;line-height:24px">确认提交</h4>
            <p class="note">对话框示范：elevated 表面 + popup 阴影 + 45% 遮罩。</p>
            <div class="btn-row">
              <button class="btn-primary" type="button">确定</button>
              <button class="btn-default" type="button">取消</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">ModalForm · 弹窗表单</h3>
        <p class="note" style="margin:0 0 16px">pro-components 的对话框版本：以 Modal 承载表单，触发器、打开关闭与提交态内置。</p>
        <div id="modalform-mount">正在加载组件（本地依赖，约数秒）…</div>
      </div>
    </main>
  </div>
  <script src="assets/layout.js?v=2"></script>
  <script src="vendor/protable.js?v=2"></script>
</body>
</html>
