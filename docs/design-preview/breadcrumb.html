<h2 id="breadcrumb">面包屑</h2>
      <p class="lead">显示当前页面在系统层级结构中的位置，并支持向上层级返回（antd <code>Breadcrumb</code>）。用于层级较深的详情页与设置页，列表页与首页不需要。</p>

      <div class="card">
        <h3 style="margin-top:0">Breadcrumb · 三种用法</h3>
        <p class="note" style="margin:0 0 16px">层级不超过三层（首页 / 模块 / 当前页）；末项为当前页、不可点击；中间层级可点击返回或用下拉承载平级切换。</p>
        <div id="breadcrumb-mount">正在加载组件（本地依赖，约数秒）…</div>
      </div>
