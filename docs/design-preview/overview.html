<h2 id="overview">概述</h2>
      <div class="card">
        <p><strong>Pkuse Design</strong> 是<strong>北大软件产品研发部</strong>的产品设计系统，基于 <strong>Ant Design v6</strong> 构建，作为部门产品的视觉与交互基线，主要面向中后台管理系统、看板和运营工具。</p>
        <p>Pkuse Design 以 Token 驱动：色彩、字体、间距、形状、层级与深度均对齐 Ant Design v6 默认浅色主题，第一版直接采用默认蓝 <code>#1677FF</code>，不另造品牌色。本页用于即时预览与对照，各产品落地时以 Pkuse Design 为准。</p>
      </div>
