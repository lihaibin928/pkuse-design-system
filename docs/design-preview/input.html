        <h3 style="margin-top:0">Input / Select · ProForm 字段</h3>
        <p class="note" style="margin:0 0 16px">输入框与下拉在 pro-components 中以表单字段形式提供：输入框用 <code>ProFormText</code>，下拉用 <code>ProFormSelect</code>（另有日期 <code>ProFormDatePicker</code>、单选 <code>ProFormRadio</code>）。控 32px 高、与按钮对齐；细 1px 描边；焦点加粗主色边并带内发光；占位符用 <code>on-surface-disabled</code>；Select 在交互前看起来像 Input。以下为真实组件渲染。</p>
        <div id="proform-mount">正在加载组件（本地依赖，约数秒）…</div>
